<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta name="description" content="Warframe world timers, fissures, missions, Nightwave and vendors for a second screen.">
<title>Orbiter Panel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.warframestat.us">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Rajdhani:wght@500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: icon rail + one pane over a star-chart backdrop. Type scales with the screen so the Thor's bottom panel is filled.
   Committed single dark look (OLED), modelled on Warframe's menus: translucent navy panels, hairline frames with corner ticks,
   tracked uppercase headings, Orokin gold and Void cyan. */
:root{
  color-scheme: dark;
  --space:#03050a;
  --panel:rgba(11,17,27,.80);
  --panel-hi:rgba(22,33,48,.86);
  --edge:rgba(150,190,220,.20);
  --tick:rgba(205,232,250,.62);
  --text:#ecf2f7;
  --muted:#a2b3c2;
  --faint:#63738a;
  --gold:#e2bb64;
  --gold-wash:rgba(226,187,100,.15);
  --void:#82e4ff;
  --void-wash:rgba(130,228,255,.12);

  --ok:#7fdc9a; --warn:#f0bd5c; --bad:#f07261;

  --s-day:#ffd27a; --s-night:#a6b0ff; --s-warm:#ffa45e; --s-cold:#9fdcff;
  --s-fass:#ff8a5c; --s-vome:#6ee0cf; --s-corpus:#7cb6ff; --s-grineer:#f07b55;
  --s-joy:#ffdd66; --s-anger:#ff6555; --s-envy:#90de74; --s-sorrow:#86a3ee; --s-fear:#c592ea;

  --t-lith:#d39b68; --t-meso:#c3cbd4; --t-neo:#e6cd80; --t-axi:#f4eedb; --t-requiem:#ef5b52; --t-omnia:#c39cff;

  --fa-grineer:#e8804a; --fa-corpus:#64b2ee; --fa-infested:#96d061; --fa-other:#c9c0a8;

  --f-head:"Rajdhani","Saira Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Saira Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;

  --ui-scale:1;
  --rail:4.3rem;
  --gap:.55rem;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{
  /* Grows with whichever screen dimension is tighter, then the Text size setting scales it. */
  font-size:calc(clamp(13px, min(3.5vw, 4.15vh), 21px) * var(--ui-scale));
  height:100%;background:var(--space);
}
body{margin:0;height:100%;background:var(--space);color:var(--text);font-family:var(--f-body);font-size:1rem;line-height:1.28;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}
img.broken{display:none}
img:not(.broken) + .gem{display:none}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lbl{font-family:var(--f-head);font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* frame: hairline box with Warframe-style corner ticks */
.frame{
  --tl:.7rem;
  border:1px solid var(--edge);
  background:
    linear-gradient(var(--tick),var(--tick)) top left / var(--tl) 1px no-repeat,
    linear-gradient(var(--tick),var(--tick)) top left / 1px var(--tl) no-repeat,
    linear-gradient(var(--tick),var(--tick)) bottom right / var(--tl) 1px no-repeat,
    linear-gradient(var(--tick),var(--tick)) bottom right / 1px var(--tl) no-repeat,
    var(--panel);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:flex;height:100%;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.rail{position:relative;flex:0 0 var(--rail);display:flex;flex-direction:column;border-right:1px solid var(--edge);background:linear-gradient(90deg,rgba(5,9,15,.92),rgba(8,13,21,.78));padding-left:env(safe-area-inset-left,0px);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tabs{display:flex;flex-direction:column;flex:1 0 auto}
.tab{flex:1;min-height:2.65rem;max-height:5.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;color:var(--faint);position:relative;font-family:var(--f-head);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tab svg{width:1.55rem;height:1.55rem}
.tab{transition:color .25s ease, background-color .25s ease}
.tab[aria-current="page"]{color:var(--gold);background:linear-gradient(90deg,transparent,var(--gold-wash))}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 .35rem rgba(226,187,100,.55))}
.rail-mark{position:absolute;right:-.28rem;top:0;width:.5rem;height:.5rem;background:var(--gold);box-shadow:0 0 .6rem var(--gold);transform:translateY(var(--y,0)) rotate(45deg);pointer-events:none;z-index:2}
.rail-mark.anim{transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.rail-foot{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding-block:.25rem;border-top:1px solid var(--edge)}
.foot-row{display:flex;justify-content:center;width:100%}
.icon-btn{width:2.1rem;height:2.3rem;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:1.3rem;height:1.3rem}
.icon-btn.has-update{position:relative;color:var(--gold)}
.icon-btn.has-update::after{content:"";position:absolute;top:.35rem;right:.3rem;width:.42rem;height:.42rem;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 .5rem var(--gold)}
.icon-btn.install{color:var(--space);background:var(--gold);width:3.2rem;height:2.2rem;margin-block:.15rem}
.status{display:flex;flex-direction:column;align-items:center;gap:.15rem;font-family:var(--f-head);font-weight:600;font-size:.66rem;letter-spacing:.06em;color:var(--muted);padding-block:.3rem;width:100%}
.dot{width:.45rem;height:.45rem;transform:rotate(45deg);background:var(--faint)}
.status[data-s="live"] .dot{background:var(--ok);box-shadow:0 0 .5rem var(--ok)}
.status[data-s="stale"] .dot{background:var(--warn)}
.status[data-s="error"] .dot{background:var(--bad)}
.status[data-s="loading"] .dot{background:var(--void);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.pane{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;container-type:inline-size;container-name:pane}
.view{padding:.6rem .7rem .8rem;display:flex;flex-direction:column;gap:.7rem;max-width:64rem;min-height:100%}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:0}
.sec-h h2{margin:0;font-family:var(--f-head);font-size:.92rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.45rem}
.sec-h h2::before{content:"";width:.42rem;height:.42rem;background:currentColor;transform:rotate(45deg);flex:none}
.sec-h .meta{font-size:.82rem;color:var(--muted);text-align:right}
.banner{font-size:.88rem;color:var(--warn);border:1px solid rgba(240,189,92,.4);background:rgba(30,22,8,.7);padding:.45rem .6rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.banner.err{color:var(--bad);border-color:rgba(240,114,97,.45);background:rgba(34,10,8,.7)}
.banner button{color:var(--text);text-decoration:underline;flex:none;font-weight:600}
.empty{color:var(--muted);font-size:.95rem;padding:.75rem 0}

/* planets: drawn, star-chart style */
.pl{display:inline-block;flex:none;width:1em;height:1em;border-radius:50%;position:relative;vertical-align:-.12em;
  background:radial-gradient(circle at 33% 30%,var(--p1),var(--p2) 50%,var(--p3) 82%);
  box-shadow:0 0 .45em color-mix(in srgb,var(--p2) 55%,transparent),inset -.12em -.14em .25em rgba(0,0,0,.55)}
.pl.band{background:repeating-linear-gradient(170deg,transparent 0 .13em,rgba(60,30,10,.28) .13em .2em),radial-gradient(circle at 33% 30%,var(--p1),var(--p2) 50%,var(--p3) 82%)}
.pl.ring::after{content:"";position:absolute;left:-.32em;right:-.32em;top:.36em;height:.28em;border:1px solid color-mix(in srgb,var(--p1) 80%,transparent);border-radius:50%;transform:rotate(-14deg)}
.pl.prox::before{content:"";position:absolute;inset:-.22em;border:1px dashed color-mix(in srgb,var(--p1) 60%,transparent);border-radius:50%}
.chip .pl{margin-right:.15em}
.chip .pl.ring{margin-inline:.35em .5em}
.nodeline{display:flex;align-items:center;gap:.4rem;min-width:0}
.nodeline > span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- world ---------- */
.view.world{gap:var(--gap);padding-block:.5rem .55rem}
.cycles{flex:1 1 auto;min-height:14.5rem;max-height:26rem;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:var(--gap)}
.cycle{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:.45rem .6rem .6rem;min-width:0;isolation:isolate;line-height:1.15}
.cycle .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.7;filter:saturate(.95)}
.cycle[data-dim] .scene{filter:brightness(.5) saturate(.6) hue-rotate(-12deg)}
.cycle::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(3,6,11,.95) 12%,rgba(3,6,11,.6) 55%,rgba(3,6,11,.2)),
             radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--state) 30%,transparent),transparent 60%)}
.cycle .place{margin-bottom:auto;padding-bottom:.25rem;display:flex;align-items:center;gap:.3rem;min-width:0;font-family:var(--f-head);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text);text-shadow:0 1px 3px #000}
.cycle .place > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cycle .place .hint{width:1.1rem;height:1.1rem;object-fit:contain;flex:none;filter:drop-shadow(0 0 .3rem var(--state))}
.cycle .st{font-family:var(--f-head);font-size:1.6rem;font-weight:700;color:var(--state);line-height:1;letter-spacing:.02em;text-shadow:0 0 .8rem color-mix(in srgb,var(--state) 45%,transparent)}
.cycle .cd{font-size:1.1rem;color:var(--text);margin-top:.12rem}
.cycle .next{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.bar i{display:block;height:100%;background:var(--state);box-shadow:0 0 .5rem var(--state);width:0}
.est{position:absolute;top:.45rem;right:.5rem;font-family:var(--f-num);font-size:.8rem;line-height:1;color:var(--muted);background:rgba(3,6,11,.6);padding:.1rem .2rem}
.cycle .est ~ .place{padding-right:1.4rem}
.resets{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.reset{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:0 .55rem;padding:.35rem .6rem;min-width:0;line-height:1.15}
.reset .ic{width:2.1rem;height:2.1rem;display:grid;place-items:center}
.reset .ic > *{grid-area:1/1}
.reset .ic img{width:100%;height:100%;object-fit:contain}
.gem{display:block;width:.8rem;height:.8rem;background:var(--void);transform:rotate(45deg);box-shadow:0 0 .7rem var(--void)}
.reset .rt{min-width:0;display:flex;flex-direction:column}
.reset .rline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .5rem}
.reset .cd{font-size:1.1rem;white-space:nowrap}
.reset .when{font-size:.78rem;color:var(--muted);white-space:nowrap}
@container pane (min-width: 46rem){
  .cycles{grid-template-columns:repeat(6,minmax(0,1fr))}
  .resets{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@container pane (max-width: 21rem){
  .cycles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .resets{grid-template-columns:1fr}
}

/* ---------- controls ---------- */
.toolbar{position:sticky;top:0;z-index:3;background:linear-gradient(rgba(3,5,10,.97),rgba(3,5,10,.93));padding:.55rem .7rem .5rem;display:flex;flex-direction:column;gap:.45rem;border-bottom:1px solid var(--edge)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--edge);background:rgba(11,17,27,.7)}
.seg button{min-height:2.5rem;font-family:var(--f-head);font-size:.86rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:.35rem;padding:0 .3rem;white-space:nowrap;min-width:0;overflow:hidden}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:linear-gradient(var(--gold-wash),rgba(226,187,100,.05));color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.seg .n{font-family:var(--f-num);font-size:.76rem;opacity:.8;letter-spacing:0}
.chips{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;margin-inline:-.7rem;padding-inline:.7rem}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:2.4rem;padding:0 .55rem 0 .35rem;border:1px solid var(--edge);background:rgba(11,17,27,.7);font-family:var(--f-head);font-size:.86rem;font-weight:700;letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:.3rem}
.chip img{width:1.7rem;height:1.7rem;object-fit:contain}
.chip .gem{width:.6rem;height:.6rem;margin-inline:.35rem .1rem;transform:rotate(45deg);background:var(--tier,var(--void))}
.chip[aria-pressed="true"]{border-color:var(--tier,var(--void));color:var(--text);background:var(--panel-hi);box-shadow:inset 0 0 .8rem color-mix(in srgb,var(--tier,var(--void)) 25%,transparent)}
.chip:disabled{opacity:.35}
.chip .n{font-family:var(--f-num);font-size:.74rem;color:var(--muted);letter-spacing:0}

/* ---------- rows ---------- */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.65rem;padding:.45rem .5rem;border-bottom:1px solid var(--edge)}
.row:last-child{border-bottom:0}
.row .main{min-width:0;display:flex;flex-direction:column;gap:.1rem}
.row .t{font-family:var(--f-head);font-weight:700;font-size:1.12rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.row .s{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.wrap{white-space:normal}
.row .cd{font-size:1rem;color:var(--text);text-align:right}
.row-2{grid-template-columns:auto minmax(0,1fr)}
.row .mod{color:var(--void)}
.fis{background:linear-gradient(90deg,color-mix(in srgb,var(--tier) 9%,transparent),transparent 45%)}
.fis:nth-child(odd){background-color:rgba(255,255,255,.015)}
.relic{width:3.1rem;display:flex;flex-direction:column;align-items:center;gap:0}
.relic .art{width:2.7rem;height:2.15rem;position:relative;display:grid;place-items:center}
.relic .art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 .35rem color-mix(in srgb,var(--tier) 55%,transparent))}
.relic .art img + img{position:absolute;width:70%;height:70%;right:0;bottom:0}
.relic .art .gem{position:absolute;width:.9rem;height:.9rem;background:var(--tier);box-shadow:none;transform:rotate(45deg);z-index:-1;opacity:.6}
.relic b{font-family:var(--f-head);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tier);line-height:1}
.fast{font-family:var(--f-head);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--void);margin-left:.4rem;vertical-align:.15em}
.faction{width:1.15rem;height:1.15rem;object-fit:contain;flex:none;opacity:.9}
.idx{width:1.7rem;height:1.7rem;display:grid;place-items:center;font-family:var(--f-num);font-size:.82rem;color:var(--gold);border:1px solid rgba(226,187,100,.4);transform:rotate(45deg)}
.idx > *{transform:rotate(-45deg)}
.card{padding:.6rem .7rem;display:flex;flex-direction:column;gap:.4rem;min-width:0}
.card .rows .row{padding-inline:.15rem}
.card-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;align-items:center}
.portrait{width:3.6rem;height:3.6rem;border:1px solid var(--edge);background:rgba(255,255,255,.03);display:grid;place-items:center;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait.contain img{object-fit:contain;padding:.15rem}
.big{font-family:var(--f-head);font-size:1.45rem;font-weight:700;line-height:1.1}
.sub{font-size:.9rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:var(--gap)}
.thumb{width:2.6rem;height:2rem;object-fit:contain;flex:none}

/* invasions */
.inv{padding:.55rem .6rem;display:flex;flex-direction:column;gap:.35rem}
.inv-top{display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.inv-top .t{font-family:var(--f-head);font-size:1.1rem;font-weight:700;min-width:0}
.inv-top .mono{font-size:.85rem;color:var(--muted);flex:none}
.tug{height:.35rem;display:flex;background:rgba(255,255,255,.08)}
.tug i{display:block;height:100%}
.inv-sides{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;font-size:.85rem}
.side{display:flex;align-items:center;gap:.45rem;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side > div{min-width:0}
.side em{font-style:normal;font-family:var(--f-head);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:.3rem}
.side.r em{justify-content:flex-end}
.side span{color:var(--text)}

/* nightwave */
.nw-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.65rem;align-items:center;padding:.5rem .5rem;border-bottom:1px solid var(--edge);width:100%;text-align:left}
.nw-row:last-child{border-bottom:0}
.check{width:1.6rem;height:1.6rem;border:1px solid var(--muted);display:grid;place-items:center;color:var(--space);transform:rotate(45deg)}
.check svg{width:1rem;height:1rem;transform:rotate(-45deg)}
.nw-row[aria-pressed="true"] .check{background:var(--gold);border-color:var(--gold);box-shadow:0 0 .6rem var(--gold-wash)}
.nw-row[aria-pressed="true"] .t,.nw-row[aria-pressed="true"] .s{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.rep{font-family:var(--f-num);font-size:.95rem;color:var(--gold);text-align:right}
.rep small{display:block;font-family:var(--f-head);font-weight:600;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nw-row .main{min-width:0;display:flex;flex-direction:column}
.nw-row .t{font-family:var(--f-head);font-weight:700;font-size:1.08rem}
.nw-row .s{font-size:.85rem;color:var(--muted)}
.tally{display:flex;gap:1.4rem;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font-family:var(--f-num);font-size:1.35rem;font-weight:500}

/* vendors */
.price{font-family:var(--f-num);font-size:.92rem;text-align:right;white-space:nowrap}
.price .duc{color:var(--gold);display:inline-flex;align-items:center;gap:.2rem}
.price .duc img{width:1.1rem;height:1.1rem;object-fit:contain}
.price .cr{color:var(--muted);font-size:.78rem;display:block}
.pill{display:inline-block;font-family:var(--f-head);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.1rem .45rem;border:1px solid currentColor}
.pill.here{color:var(--ok)}
.pill.away{color:var(--muted)}
.pill.old{color:var(--warn)}
.stock{height:.3rem;background:rgba(255,255,255,.08)}
.stock i{display:block;height:100%;background:var(--gold)}
.costline{display:flex;align-items:center;gap:.35rem;font-size:.9rem;color:var(--muted)}
.costline img{width:1.2rem;height:1.2rem;object-fit:contain}
.reward{display:flex;align-items:center;gap:.6rem}
.reward img{width:3.4rem;height:2.6rem;object-fit:contain;filter:drop-shadow(0 0 .4rem rgba(226,187,100,.25))}

/* settings sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(1,3,6,.78);display:flex;align-items:center;justify-content:center;padding:.8rem}
.sheet-body{width:min(30rem,100%);max-height:100%;overflow:auto;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.8rem}
.sheet-body h2{margin:0;font-family:var(--f-head);font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.field{display:flex;flex-direction:column;gap:.35rem}
.fine{font-size:.84rem;color:var(--muted);margin:0}
.btn{min-height:2.6rem;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-head);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;padding:0 1rem;background:var(--gold-wash)}
.btn.solid{background:var(--gold);color:var(--space)}
.steps{margin:0;padding-left:1.2rem;font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:.2rem}
.steps b{color:var(--text)}

/* ---------- events ---------- */
.ev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@container pane (max-width: 21rem){ .ev-grid{grid-template-columns:1fr} }
@container pane (min-width: 46rem){ .ev-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.ev-card{position:relative;overflow:hidden;isolation:isolate;aspect-ratio:16/11;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:.15rem;padding:.55rem .65rem .6rem;text-align:left;border:1px solid var(--edge);background:linear-gradient(160deg,var(--c1),var(--c2));transition:transform .18s ease,border-color .2s ease}
.ev-card:active{transform:scale(.97)}
.ev-card .art{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.ev-card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(3,6,11,.92) 10%,rgba(3,6,11,.35) 55%,rgba(3,6,11,.05))}
.ev-card::after{content:"";position:absolute;top:0;left:0;width:.8rem;height:.8rem;border-top:1px solid var(--tick);border-left:1px solid var(--tick)}
.ev-card .badge{position:absolute;top:.5rem;right:.55rem;font-family:var(--f-head);font-weight:700;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:.08rem .4rem;border:1px solid currentColor;background:rgba(3,6,11,.55)}
.ev-card .badge.live{color:var(--ok)}
.ev-card .badge.off{color:var(--muted)}
.ev-card .nm{font-family:var(--f-head);font-weight:700;font-size:1.12rem;line-height:1.05;text-shadow:0 1px 4px #000;text-wrap:balance}
.ev-card .wh{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-card .cd{font-size:.86rem;color:var(--text)}
.ev-card .meter{height:3px;background:rgba(255,255,255,.12);margin-top:.15rem}
.ev-card .meter i{display:block;height:100%;background:var(--ac);box-shadow:0 0 .4rem var(--ac)}
.ev-card.off{filter:saturate(.75)}
.ev-card.off .nm{color:#cfd8e1}
.ev-hero{position:relative;overflow:hidden;aspect-ratio:16/8;max-width:100%;max-height:52vh;border:1px solid var(--edge)}
.ev-hero canvas{position:absolute;inset:0;width:100%;height:100%}
.ev-hero .cap{position:absolute;left:0;right:0;bottom:0;padding:.7rem .8rem .65rem;background:linear-gradient(to top,rgba(3,6,11,.92),transparent);display:flex;flex-direction:column;gap:.1rem}
.ev-hero .cap .nm{font-family:var(--f-head);font-weight:700;font-size:1.6rem;line-height:1.05;text-shadow:0 2px 8px #000;animation:evTitle .9s cubic-bezier(.2,.75,.25,1) both .25s}
.ev-hero .cap .wh{font-size:.88rem;color:var(--muted);animation:evTitle .9s cubic-bezier(.2,.75,.25,1) both .45s}
@keyframes evTitle{from{opacity:0;transform:translateY(12px);letter-spacing:.12em}to{opacity:1;transform:none}}
.ev-prog{display:flex;flex-direction:column;gap:.35rem}
.ev-prog .track{position:relative;height:.5rem;background:rgba(255,255,255,.08)}
.ev-prog .track i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);box-shadow:0 0 .6rem var(--ac)}
.ev-prog .track b{position:absolute;top:-.25rem;width:.55rem;height:.55rem;margin-left:-.27rem;transform:rotate(45deg);border:1px solid var(--muted);background:var(--space)}
.ev-prog .track b.hit{background:var(--ac);border-color:var(--ac)}
.ms{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.6rem;align-items:center;padding:.45rem .2rem;border-bottom:1px solid var(--edge)}
.ms:last-child{border-bottom:0}
.ms .goal{font-family:var(--f-num);font-size:.95rem;min-width:2.6rem;text-align:right;color:var(--muted)}
.ms.got .goal{color:var(--ac)}
.ms .t{font-family:var(--f-head);font-weight:700;font-size:1.02rem}
.ms .main{display:flex;flex-direction:column;min-width:0}
.ms .thumbs{display:flex;gap:.2rem}
.ms .thumbs img,.ms .thumbs .ph{width:2.2rem;height:1.8rem;object-fit:contain}
.ms.final{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 14%,transparent),transparent)}

/* ---------- weekly ---------- */
.wk-head .summary b{font-size:1.2rem}
.wk-head .when{font-size:.74rem;color:var(--muted)}
.wk-tools{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.wk-sec{padding:.55rem 0 .15rem}
.wk-sec > .sec-h{padding-inline:.6rem}
.wk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--edge)}
.wk-row:last-child{border-bottom:0}
.wk-main{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.6rem;align-items:center;padding:.5rem .5rem;text-align:left;width:100%;min-width:0}
.wk-main .main{min-width:0;display:flex;flex-direction:column}
.wk-main .t{font-family:var(--f-head);font-weight:700;font-size:1.08rem;line-height:1.15}
.wk-main .s{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-row.done .t,.wk-row.done .s{color:var(--faint)}
.wk-row.done .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.wk-mark{display:grid;place-items:center;width:2.7rem;flex:none}
.wk-mark.multi{display:flex;flex-direction:column;align-items:center;gap:.15rem}
.wk-main[aria-pressed="true"] .check{background:var(--gold);border-color:var(--gold)}
.pips{display:flex;gap:.22rem;padding:.12rem}
.pips i{width:.42rem;height:.42rem;transform:rotate(45deg);border:1px solid var(--muted)}
.pips i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 .3rem var(--gold-wash)}
.cnt{font-size:.72rem;color:var(--muted)}
.wk-ic{width:2rem;height:2rem;display:grid;place-items:center}
.wk-art{width:100%;height:100%;object-fit:contain}
.wk-gem{width:.75rem;height:.75rem;transform:rotate(45deg);background:var(--g,var(--void));box-shadow:0 0 .55rem var(--g,var(--void))}
.wk-gem.ice{--g:#a9e8ff}.wk-gem.deep{--g:#5fb3ff}.wk-gem.temporal{--g:#c39cff}.wk-gem.desc{--g:#ef5b52}.wk-gem.circ{--g:#ffdd66}
.wk-gem.spc{--g:#ff8a5c}.wk-gem.net{--g:#6ee0cf}.wk-gem.kahl{--g:#90de74}.wk-gem.riv{--g:#c592ea}.wk-gem.shard{--g:#e2bb64}
.wk-more{width:2.6rem;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--edge)}
.wk-more svg{width:1.05rem;height:1.05rem;transition:transform .25s ease}
.wk-more[aria-expanded="true"]{color:var(--gold)}
.wk-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.wk-detail{grid-column:1/-1;padding:.1rem .7rem .7rem 3.2rem;display:flex;flex-direction:column;gap:.45rem}
.wk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem;font-size:.88rem}
.wk-list b{font-family:var(--f-head);font-weight:700;font-size:.98rem}
.wk-list span{color:var(--muted)}
.wk-mission{display:flex;flex-direction:column;gap:.3rem;padding-bottom:.3rem;border-bottom:1px solid var(--edge)}
.wk-mission:last-of-type{border-bottom:0}
.wk-mission .t{display:flex;align-items:center;gap:.55rem;font-family:var(--f-head);font-weight:700;font-size:1.02rem}
.wk-mission .idx{width:1.4rem;height:1.4rem;font-size:.72rem}
.wk-tag{font-size:.84rem;padding:.25rem .45rem;border-left:2px solid var(--edge);display:flex;flex-direction:column}
.wk-tag b{font-family:var(--f-head);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wk-tag span{color:var(--muted);font-size:.8rem}
.wk-tag.dev{border-color:var(--void)}.wk-tag.dev b{color:var(--void)}
.wk-tag.hard{border-color:var(--bad)}.wk-tag.hard b{color:var(--bad)}
.chip.static{cursor:default;min-height:1.9rem;font-size:.8rem}
.eye{width:1.6rem;height:1.6rem;border:1px solid var(--faint);display:grid;place-items:center}
.eye.on{border-color:var(--gold);background:var(--gold-wash)}
.eye.on::after{content:"";width:.5rem;height:.5rem;background:var(--gold);transform:rotate(45deg)}
.wk-row.editing .wk-main{grid-template-columns:auto auto minmax(0,1fr)}

/* ---------- search ---------- */
.sbox{display:flex;align-items:center;gap:.45rem;border:1px solid var(--edge);background:rgba(11,17,27,.85);padding:0 .25rem 0 .6rem;min-height:2.8rem;transition:border-color .2s ease, box-shadow .2s ease}
.sbox:focus-within{border-color:var(--gold);box-shadow:0 0 .8rem rgba(226,187,100,.18)}
.sbox > svg{width:1.2rem;height:1.2rem;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-family:var(--f-body);font-weight:500;font-size:1.05rem;-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox input::placeholder{color:var(--faint)}
.sbox button{width:2.3rem;height:2.3rem;display:grid;place-items:center;color:var(--muted);flex:none}
.sbox button svg{width:1.05rem;height:1.05rem}
.hit{width:100%;text-align:left;font:inherit;color:inherit}
.hit-art{width:2.7rem;height:2.15rem;object-fit:contain;flex:none;display:block}
.hit-art.ph{display:grid;place-items:center}
.hit-art.ph::before{content:"";width:.6rem;height:.6rem;transform:rotate(45deg);background:var(--faint)}
.chev{color:var(--faint);font-family:var(--f-head);font-size:1.2rem}
.tagline{font-size:.88rem;color:var(--muted);margin:0}
.recents{display:flex;flex-wrap:wrap;gap:.4rem}
.back{display:inline-flex;align-items:center;gap:.35rem;align-self:flex-start;min-height:2.3rem;padding-right:.5rem;font-family:var(--f-head);font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.back svg{width:1rem;height:1rem}
.detail-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.75rem;align-items:center}
.hero{width:5.4rem;height:4.3rem;object-fit:contain;filter:drop-shadow(0 0 .6rem rgba(130,228,255,.18))}
.hero.ph{display:grid;place-items:center;border:1px solid var(--edge)}
.summary{display:flex;gap:1.2rem;flex-wrap:wrap}
.summary div{display:flex;flex-direction:column}
.summary b{font-family:var(--f-num);font-weight:500;font-size:1.35rem}
.summary b small{font-size:.75rem;color:var(--muted);margin-left:.1rem}
.sub-h{font-family:var(--f-head);font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}
.order{grid-template-columns:auto minmax(0,1fr) auto}
.plat{font-family:var(--f-num);font-size:1.15rem;color:var(--text);min-width:3.2rem}
.plat small{font-size:.72rem;color:var(--gold);margin-left:.1rem}
.who{display:flex;align-items:center;gap:.35rem;min-width:0}
.who span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.presence{width:.45rem;height:.45rem;transform:rotate(45deg);flex:none;background:var(--faint)}
.presence.ingame{background:var(--ok);box-shadow:0 0 .4rem var(--ok)}
.presence.online{background:var(--void)}
.copy{min-height:2.1rem;padding:0 .55rem;border:1px solid rgba(226,187,100,.45);font-family:var(--f-head);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.copy:active{background:var(--gold-wash)}
.drop-group + .drop-group{border-top:1px solid var(--edge);padding-top:.35rem}
.drop-group h3{margin:0;padding:.2rem .5rem;font-family:var(--f-head);font-size:1rem;font-weight:700;letter-spacing:.03em;display:flex;justify-content:space-between;gap:.5rem}
.drop-group h3 span{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.chance{font-family:var(--f-num);font-size:.98rem;text-align:right;white-space:nowrap}
.chance small{display:block;font-family:var(--f-head);font-weight:700;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.rar-common{color:#d39b68}.rar-uncommon{color:#c3cbd4}.rar-rare{color:#e6cd80}.rar-legendary{color:#f4eedb}
.more{width:100%;min-height:2.3rem;font-family:var(--f-head);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--void)}
.toast{max-width:calc(100% - 2rem);width:max-content;text-align:center;position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:20;transform:translateX(-50%);background:var(--panel-hi);border:1px solid var(--gold);color:var(--text);padding:.5rem .9rem;font-family:var(--f-head);font-weight:700;letter-spacing:.06em;font-size:.9rem;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <span class="rail-mark" id="rail-mark" aria-hidden="true"></span>
    <div class="tabs" id="tabs"></div>
    <div class="rail-foot">
      <button class="icon-btn install" id="install-btn" aria-label="Install app" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
      </button>

        </button>

  </nav>
  <main class="pane" id="pane" tabindex="-1"></main>

      </label>
    </div>
    <div class="view" id="s-body"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div>

<script src="event-fx.js"></script>
<script>
(() => {

  mercury:["#ded6cb","#8f8476","#2c2620"], venus:["#ffe2a0","#cc983f","#4f320e"], earth:["#bfe9ff","#3f8ec2","#103248"],
  lua:["#f1f1ec","#a9a9a2","#3f3f3b"], mars:["#ffb08a","#be5530","#43160a"], phobos:["#d8c3a9","#86705a","#30251b"],
  deimos:["#f0a0a0","#93394d","#2f0d16"], ceres:["#cdd0d4","#71777e","#25282c"], jupiter:["#ffe6c0","#c88d5c","#4f331c"],
  europa:["#f6fbff","#a9c6de","#38536b"], saturn:["#f8e8b6","#c3a466","#4f3d1b"], uranus:["#d3fffb","#5ec8cb","#18545a"],
  neptune:["#b8caff","#4062d6","#131f57"], pluto:["#efe2d4","#a68c7a","#3d3028"], sedna:["#ffa092","#b8443b","#420f0c"],
  eris:["#cdeea0","#5f9a3c","#1c3417"], "kuva fortress":["#ff8f7f","#a8201f","#330505"], void:["#fff4cf","#e2bb64","#5e420f"],
  zariman:["#f4f7fa","#a9b8c6","#36424e"], duviri:["#ffd1e2","#b9658a","#3a1626"], veil:["#ddc9ff","#7d5bc9","#251a46"],
  "dark refractory":["#f0a0a0","#93394d","#2f0d16"], "höllvania":["#c7f0c9","#5f9a7c","#1b3329"], hollvania:["#c7f0c9","#5f9a7c","#1b3329"],
  _:["#d3dde7","#73869a","#243140"],
};

const ICONS = {
  world:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="6"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-18 12 12)"/></svg>',

function projectCycle(def, raw, now){
  if (!raw || !raw.expiry) return null;
  const n = def.phases.length;
  let i = def.phases.findIndex(p => p[0] === String(raw.state || "").toLowerCase());
  let end = ts(raw.expiry);
  if (i < 0 || !Number.isFinite(end)) return null;
  let projected = false;
  if (end <= now) {
    projected = true;
    const period = def.phases.reduce((a, p) => a + p[2], 0) * 1000;
    end += Math.floor((now - end) / period) * period;
    let guard = 0;
    while (end <= now && guard++ < 50) { i = (i + 1) % n; end += def.phases[i][2] * 1000; }
  }
  const cur = def.phases[i], nxt = def.phases[(i + 1) % n];
  let start = end - cur[2] * 1000;
  if (!projected) { const a = ts(raw.activation); if (Number.isFinite(a) && a < end) start = a; }
  return { id:cur[0], label:cur[1], next:nxt[1], start, end, projected };
}

function teshin(sp, now){
  if (!sp || !sp.currentReward) return null;
  const rot = sp.rotation || [];
  let idx = rot.findIndex(r => r.name === sp.currentReward.name);
  let end = ts(sp.expiry), cur = sp.currentReward, rolled = false;
  if (!Number.isFinite(end)) return null;
  if (end <= now) {
    const w = Math.ceil((now - end + 1) / WEEK);
    end += w * WEEK; rolled = true;
    if (idx >= 0 && rot.length) { idx = (idx + w) % rot.length; cur = rot[idx]; }
  }
  const next = idx >= 0 && rot.length ? rot[(idx + 1) % rot.length] : null;
  return { cur, next, end, rolled };
}

let parserP = null;
function loadParser(){

  if (!parserP) parserP = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "worldstate-parser.js"; s.async = true;

async function load(){
  if (S.loading) return;
  S.loading = true; S.error = null; paintStatus();
  // 1) warframestat.us (community, already parsed)  2) Digital Extremes' official feed, parsed in the app  3) warframestat.us again.
  // warframestat sends every platform to the PC world state now (crossplay), so the path is always /pc.
  const sources = [
    { kind:"wfs", url:"https://api.warframestat.us/pc?language=en" },
    { kind:"de",  url:"https://api.warframe.com/cdn/worldState.php" },
    { kind:"wfs", url:`https://api.warframestat.us/pc/?language=en&t=${Date.now()}` },
  ];
  let reason = "", firstReason = "", staleCopy = null;
  // warframestat.us keeps answering with its last good copy when it can't reach Digital Extremes.
  // Treat a copy as stale if it's more than 15 minutes old or has no fissure still running, and try the next source.
  const freshness = j => {
    const age = Date.now() - ts(j.timestamp), now = Date.now();
    if (!(age < 15 * MIN)) return "stale data";
    if (!(j.fissures || []).some(f => ts(f.expiry) > now)) return "no live fissures";
    return "";
  };
  const accept = (j, kind) => {
    S.data = slim(j); S.fetchedAt = Date.now(); S.fetchedOk = true; S.lastReason = ""; S.source = kind;
    S.dataTime = ts(j.timestamp) || Date.now();
    store.set("orbiter.cache." + prefs.platform, { t:S.fetchedAt, data:S.data });
    pushWidgetSnapshot();
  };
  for (let i = 0; i < sources.length && !S.fetchedOk; i++) {
    const src = sources[i];
    if (i === 2) await new Promise(r => setTimeout(r, 1200));
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 20000);
    try {
      const r = await fetch(src.url, { signal:ctrl.signal, cache:"no-store" });
      if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { code:"HTTP " + r.status });
      const text = await r.text();
      let j;
      if (src.kind === "de") {
        await loadParser();
        try { j = await window.OrbiterParse(text); } catch (e) { throw Object.assign(new Error("parse"), { code:"official feed format changed" }); }
      } else {
        try { j = JSON.parse(text); } catch (e) { throw Object.assign(new Error("bad data"), { code:/^\s*</.test(text) ? "got a web page instead of data" : "unreadable data" }); }
      }
      if (!j || typeof j !== "object" || Array.isArray(j) || !j.timestamp) throw Object.assign(new Error("bad data"), { code:"unexpected data" });
      const stale = freshness(j);
      if (stale) {
        if (!staleCopy || ts(j.timestamp) > ts(staleCopy.j.timestamp)) staleCopy = { j, kind:src.kind };
        throw Object.assign(new Error("stale"), { code:stale });
      }

      if (!firstReason) firstReason = reason;
    } finally { clearTimeout(to); }
  }
  if (!S.fetchedOk && firstReason && firstReason !== reason) reason = firstReason;
  // Every source was stale or down: an old copy still beats nothing, but say so.
  let staleNote = "";
  if (!S.fetchedOk && staleCopy) { accept(staleCopy.j, staleCopy.kind); staleNote = `The data services are behind right now. Showing world data from ${when(S.dataTime)}; fissures may be missing.`; }
  if (!S.fetchedOk) {
    S.lastReason = reason;

      : `Couldn't reach the Warframe data service (${reason}).`;

}

        <span class="st">${esc(c.label)}</span>
        ${cd(c.end)}
        <span class="next">${esc(c.next)} at ${esc(clock(c.end))}</span>
        <div class="bar"><i data-start="${c.start}" data-stop="${c.end}" style="width:${pct.toFixed(1)}%"></i></div>
      </article>`;
    }).join("");

    const resets = [["Daily reset", nextUtcMidnight(now), ""]];
    if (d.sortie && d.sortie.expiry) resets.push(["Sortie", rollForward(ts(d.sortie.expiry), DAY, now), factionImg(d.sortie.faction, "")]);
    if (d.archonHunt && d.archonHunt.expiry) {
      const a = ARCHON[archonOf(d.archonHunt.boss)];
      resets.push(["Archon Hunt", rollForward(ts(d.archonHunt.expiry), WEEK, now), a ? img(a[0], "", a[1] + " Archon Shard") : ""]);
    }
    const vt = d.voidTrader;
    if (vt) {
      const a = ts(vt.activation), e = ts(vt.expiry);
      if (now < a) resets.push(["Baro arrives", a, img(ART.baro, "", "Baro Ki'Teer")]);
      else if (now < e) resets.push(["Baro leaves", e, img(ART.baro, "", "Baro Ki'Teer")]);
    }
    const resetHtml = resets.filter(r => Number.isFinite(r[1])).map(([l, t, ic]) =>
      `<div class="reset frame" data-cycle-end="${t}"><span class="ic">${ic}<span class="gem"></span></span>
        <div class="rt"><span class="lbl">${esc(l)}</span><span class="rline">${cd(t)}<span class="when">${esc(when(t))}</span></span></div></div>`).join("");

    return `<div class="view world">${notice()}
      <section class="cycles" aria-label="Open world cycles">${tiles}</section>
      <section class="resets" aria-label="Upcoming resets">${resetHtml}</section>
    </div>`;
  },

  fissures(d, now){
    const all = (d.fissures || []).filter(f => ts(f.expiry) > now);
    const modeOf = f => f.isStorm ? "storm" : f.isHard ? "hard" : "normal";
    const counts = { normal:0, hard:0, storm:0 }; all.forEach(f => counts[modeOf(f)]++);
    const inMode = all.filter(f => modeOf(f) === prefs.fisMode);
    const tierCount = {}; inMode.forEach(f => tierCount[f.tier] = (tierCount[f.tier] || 0) + 1);
    const sel = new Set(prefs.fisTiers);
    const list = inMode
      .filter(f => !sel.size || sel.has(f.tier))
      .filter(f => !prefs.fisFast || FAST.has(f.missionType))
      .sort((a, b) => (a.tierNum || 9) - (b.tierNum || 9) || ts(a.expiry) - ts(b.expiry));
    const seg = [["normal","Normal"],["hard","Steel Path"],["storm","Storms"]].map(([id, l]) =>
      `<button data-fmode="${id}" aria-pressed="${prefs.fisMode === id}">${l} <span class="n">${counts[id]}</span></button>`).join("");
    const chips = TIERS.map(([t, v, art]) =>
      `<button class="chip" style="--tier:var(${v})" data-ftier="${t}" aria-pressed="${sel.has(t)}" ${tierCount[t] ? "" : "disabled"}>${img(art[art.length - 1], "", "")}${t} <span class="n">${tierCount[t] || 0}</span></button>`).join("")
      + `<button class="chip" data-ffast aria-pressed="${prefs.fisFast}" title="Capture, Extermination, Sabotage, Rescue"><span class="gem"></span>Fast</button>`;
    const rows = list.map(f => {
      const t = TIER[f.tier] || { v:"--text", art:[] };
      return `<li class="row fis" style="--tier:var(${t.v})">
        <span class="relic"><span class="art"><span class="gem"></span>${t.art.map(a => img(a, "", "")).join("")}</span><b>${esc(f.tier === "Requiem" ? "Req" : f.tier)}</b></span>
        <div class="main"><span class="t">${esc(f.missionType)}${FAST.has(f.missionType) ? '<span class="fast">fast</span>' : ""}</span>
          <span class="s nodeline">${planet(f.node)}<span>${esc(f.node)}</span>${factionImg(f.enemy)}</span></div>
        ${cd(ts(f.expiry))}
      </li>`;
    }).join("");
    return `<div class="toolbar"><div class="seg" role="group" aria-label="Fissure type">${seg}</div><div class="chips" role="group" aria-label="Relic tier">${chips}</div></div>
      <div class="view">${notice()}${rows ? `<ul class="rows frame">${rows}</ul>` : `<p class="empty">No fissures match these filters right now.</p>`}
        ${S.dataTime ? `<p class="fine">Game data from ${esc(clock(S.dataTime))} · ${S.source === "de" ? "Digital Extremes' feed" : "warframestat.us"} · refreshes every 2 minutes</p>` : ""}</div>`;
  },

  missions(d, now){
    needItems();
    const out = [];
    const s = d.sortie;
    if (s && s.variants && s.variants.length) {
      const end = ts(s.expiry), old = !(end > now);
      out.push(`<section class="card frame">
        <div class="card-head"><span class="portrait contain">${factionImg(s.faction, "")}</span>
          <div><div class="sec-h"><h2>Sortie</h2><span class="meta">${old ? rotating : "Ends in " + cd(end)}</span></div>
          <div class="sub">${esc(s.boss)} · ${esc(s.faction)}</div></div></div>
        <ul class="rows">${s.variants.map((v, i) => `<li class="row row-2"><span class="idx"><span>${i + 1}</span></span>
          <div class="main"><span class="t">${esc(v.missionType)}</span><span class="s">${nodeline(v.node)}</span><span class="s wrap mod">${esc(v.modifier)}</span></div></li>`).join("")}</ul>
      </section>`);
    }
    const a = d.archonHunt;
    if (a && a.missions && a.missions.length) {
      const end = ts(a.expiry), old = !(end > now);
      const shard = ARCHON[archonOf(a.boss)];
      out.push(`<section class="card frame">
        <div class="card-head"><span class="portrait contain">${shard ? img(shard[0], "", shard[1] + " Archon Shard") : factionImg(a.faction, "")}</span>
          <div><div class="sec-h"><h2>Archon Hunt</h2><span class="meta">${old ? rotating : "Ends in " + cd(end)}</span></div>
          <div class="sub">${esc(a.boss)}${shard ? ` · ${shard[1]} shard` : ""}</div></div></div>
        <ul class="rows">${a.missions.map((m, i) => `<li class="row row-2"><span class="idx"><span>${i + 1}</span></span>
          <div class="main"><span class="t">${esc(m.type)}</span><span class="s">${nodeline(m.node)}</span></div></li>`).join("")}</ul>
      </section>`);
    }
    const top = out.length ? `<div class="two">${out.join("")}</div>` : "";

    const side = (sd, reward, right) => {
      const parts = rewardParts(reward), first = parts.find(p => p.name);
      return `<div class="side${right ? " r" : ""}">${first ? itemImg(first.name) : ""}<div>
        <em style="color:var(${factionVar(sd.faction)})">${factionImg(sd.faction)}${esc(sd.faction)}</em>
        <span>${esc(parts.map(p => p.text).join(", ") || "No reward")}</span></div></div>`;
    };
    const inv = (d.invasions || []);
    const invHtml = inv.length ? `<section class="frame" style="padding:.55rem 0 .2rem">
      <div class="sec-h" style="padding-inline:.6rem"><h2>Invasions</h2><span class="meta">${inv.length} active</span></div>
      ${inv.map(i => {
        const p = Math.min(100, Math.max(0, Number(i.completion) || 0));
        const av = factionVar(i.attacker.faction), dv = factionVar(i.defender.faction);
        return `<div class="inv">
          <div class="inv-top"><span class="t">${nodeline(i.node)}</span><span class="mono">${p.toFixed(0)}%</span></div>
          <div class="tug" aria-hidden="true"><i style="width:${p}%;background:var(${av})"></i><i style="flex:1;background:var(${dv});opacity:.55"></i></div>
          <div class="inv-sides">${side(i.attacker, i.vsInfestation ? null : i.attacker.reward, false)}${side(i.defender, i.defender.reward, true)}</div>
        </div>`;
      }).join("")}</section>` : "";

    const alerts = (d.alerts || []).filter(x => ts(x.expiry) > now);
    const events = (d.events || []).filter(x => ts(x.expiry) > now);
    const extra = (alerts.length || events.length) ? `<section class="frame" style="padding:.55rem 0 .2rem">
      <div class="sec-h" style="padding-inline:.6rem"><h2>Alerts &amp; events</h2></div>
      <ul class="rows">
        ${alerts.map(x => { const first = rewardParts(x.reward).find(p => p.name);
          return `<li class="row">${first && itemFile(first.name) ? itemImg(first.name) : '<span class="idx"><span>!</span></span>'}
          <div class="main"><span class="t">${esc(x.type)}</span><span class="s">${nodeline(x.node)}</span><span class="s wrap" style="color:var(--gold)">${esc(rewardText(x.reward) || "Reward not listed")}</span></div>${cd(ts(x.expiry))}</li>`; }).join("")}
        ${events.map(x => `<li class="row"><span class="idx"><span>◆</span></span>
          <div class="main"><span class="t">${esc(x.description)}</span><span class="s">${x.node ? nodeline(x.node) : esc(x.tooltip || "")}</span></div>${cd(ts(x.expiry))}</li>`).join("")}
      </ul></section>` : "";

    const body = top + invHtml + extra;
    return `<div class="view">${notice()}${body || `<p class="empty">No missions in the current data.</p>`}</div>`;
  },

  weekly(d, now){ return weeklyView(d, now); },
  events(d, now){ return eventsView(d, now); },

  nightwave(d, now){
    const nw = d.nightwave;
    if (!nw || !(nw.activeChallenges || []).length) return `<p class="empty">No Nightwave season is running right now.</p>`;
    const list = nw.activeChallenges.filter(c => ts(c.expiry) > now);
    const groups = [
      ["Daily", list.filter(c => c.isDaily)],
      ["Weekly", list.filter(c => !c.isDaily && !c.isElite)],
      ["Elite weekly", list.filter(c => c.isElite)],
    ];
    const left = list.filter(c => !nwDone[c.id]).reduce((a, c) => a + (Number(c.reputation) || 0), 0);
    const doneCount = list.filter(c => nwDone[c.id]).length;
    const seasonEnd = ts(nw.expiry);
    const rows = groups.filter(g => g[1].length).map(([name, cs]) => `<section class="frame" style="padding:.55rem 0 .15rem">
      <div class="sec-h" style="padding-inline:.6rem"><h2>${name}</h2><span class="meta">resets ${esc(when(Math.min(...cs.map(c => ts(c.expiry)))))}</span></div>
      <div>${cs.map(c => `<button class="nw-row" data-nw="${esc(c.id)}" aria-pressed="${!!nwDone[c.id]}">
          <span class="check">${CHECK}</span>
          <span class="main"><span class="t">${esc(c.title)}</span><span class="s">${esc(c.desc)}</span></span>
          <span class="rep">${Number(c.reputation || 0).toLocaleString()}<small>standing</small></span>
        </button>`).join("")}</div></section>`).join("");
    return `
      <div class="card frame" id="nightwave">
        <div class="card-head"><span class="portrait">${img(ART.nora, "", "Nora Night")}</span>
          <div><div class="sec-h"><h2>Nightwave${nw.season != null ? " · S" + esc(nw.season) : ""}</h2>${Number.isFinite(seasonEnd) && seasonEnd > now ? `<span class="meta">ends ${esc(new Date(seasonEnd).toLocaleDateString(undefined,{month:"short",day:"numeric"}))}</span>` : ""}</div>
          <div class="tally">
            <div><span class="lbl">Standing left</span><b>${left.toLocaleString()}</b></div>
            <div><span class="lbl">Done</span><b>${doneCount}/${list.length}</b></div>
          </div></div></div>
        <p class="fine">Tap a challenge to tick it off. Ticks are saved on this device.</p>
      </div>
      ${rows}`;
  },

  vendors(d, now){
    needItems();
    const parts = [];
    const vt = d.voidTrader;
    if (vt) {
      const a = ts(vt.activation), e = ts(vt.expiry);
      const here = now >= a && now < e;
      const inv = vt.inventory || [];
      const status = here ? `<span class="pill here">Here now</span>` : now < a ? `<span class="pill away">Away</span>` : `<span class="pill old">Waiting for update</span>`;
      parts.push(`<section class="card frame">
        <div class="card-head"><span class="portrait">${img(ART.baro, "", "Baro Ki'Teer")}</span>
          <div><div class="sec-h"><h2>Baro Ki'Teer</h2>${status}</div>
          <div class="big">${nodeline(vt.location || "Unknown relay")}</div>
          <div class="sub">${here ? `Leaves in ${cd(e)} · ${esc(when(e))}` : now < a ? `Arrives in ${cd(a)} · ${esc(when(a))}` : "Next visit not announced yet"}</div></div></div>
        ${here && inv.length ? `<ul class="rows">${inv.map(it => `<li class="row">${itemImg(it.item) || '<span class="thumb"></span>'}
            <div class="main"><span class="t">${esc(it.item)}</span></div>
            <span class="price"><span class="duc">${img(ART.ducat, "", "Ducats")}${Number(it.ducats || 0).toLocaleString()}</span><span class="cr">${Number(it.credits || 0).toLocaleString()} cr</span></span></li>`).join("")}</ul>` : ""}
      </section>`);
    }
    const t = teshin(d.steelPath, now);
    if (t) parts.push(`<section class="card frame">
        <div class="card-head"><span class="portrait">${img(ART.teshin, "", "Teshin")}</span>
          <div><div class="sec-h"><h2>Teshin</h2><span class="meta">rotates in ${cd(t.end)}</span></div>
          <div class="sub">Steel Path Honors${t.rolled ? " · estimated from the rotation" : ""}</div></div></div>
        <div class="reward">${itemImg(t.cur.name, "")}<div><div class="big">${esc(t.cur.name)}</div>
          <div class="costline">${img(ART.steel, "", "Steel Essence")}<span class="mono">${esc(t.cur.cost)}</span> Steel Essence</div></div></div>
        ${t.next ? `<div class="sub">Next week: <span style="color:var(--text)">${esc(t.next.name)}</span> · <span class="mono">${esc(t.next.cost)}</span> SE</div>` : ""}
      </section>`);
    const deal = (d.dailyDeals || []).find(x => ts(x.expiry) > now);
    if (deal) {
      const sold = Number(deal.sold) || 0, total = Number(deal.total) || 0;
      parts.push(`<section class="card frame">
        <div class="card-head"><span class="portrait contain">${img(ART.darvo, "", "Darvo")}</span>
          <div><div class="sec-h"><h2>Darvo's deal</h2><span class="meta">ends in ${cd(ts(deal.expiry))}</span></div>
          <div class="sub">${esc(deal.discount)}% off${total ? ` · ${(total - sold).toLocaleString()} of ${total.toLocaleString()} left` : ""}</div></div></div>
        <div class="reward">${itemImg(deal.item, "")}<div><div class="big">${esc(deal.item)}</div>
          <div class="costline"><span class="mono" style="color:var(--gold)">${esc(deal.salePrice)}p</span> <s class="mono">${esc(deal.originalPrice)}p</s></div></div></div>
        ${total ? `<div class="stock" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, (total - sold) / total * 100))}%"></i></div>` : ""}
      </section>`);
    }
    return `<div class="view">${notice()}${parts.length ? `<div class="two">${parts.join("")}</div>` : `<p class="empty">No vendor data right now.</p>`}</div>`;
  },
};

/* ================= events ================= */
const FX = window.EventFX || null;
const EV = { open:null };
const humanTag = tag => String(tag || "").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/Event$/, "").trim();
const unresolved = s => !s || /\b(Event Name|Short Event Desc|Event Desc|Event Score)\b/.test(s);
function evInfo(e){
  const key = FX ? FX.themeFor(e) : "void", th = FX ? FX.THEMES[key] : { name:"Event", colors:["#122436","#04080d","#e2bb64"], blurb:"" };
  // The data service sometimes ships a new event before its names are translated ("Road To Tau Event Name"); fall back to the theme's name.
  const name = !unresolved(e.description) ? e.description : key !== "void" ? th.name : humanTag(e.tag) || "Limited-time event";
  const blurb = !unresolved(e.tooltip) && e.tooltip ? e.tooltip : th.blurb;
  const max = Number(e.maximumScore) || 0, cur = Number(e.currentScore) || 0, hp = e.health != null ? Number(e.health) : null;
  const pct = max > 0 ? clampN(cur / max * 100) : hp != null && hp > 0 ? clampN(hp) : null;
  return { key, th, name, blurb, max, cur, pct };
}
const clampN = v => Math.max(0, Math.min(100, v));
function evCard(id, info, opts){
  const [c1, c2, ac] = info.th.colors;
  return `<button class="ev-card frame${opts.off ? " off" : ""}" data-ev="${esc(id)}" style="--c1:${c1};--c2:${c2};--ac:${ac}">
    <canvas class="art" data-fx="${info.key}" aria-hidden="true"></canvas>
    <span class="badge ${opts.off ? "off" : "live"}">${opts.off ? "Not running" : "Live"}</span>
    <span class="nm">${esc(info.name)}</span>
    <span class="wh">${esc(opts.where || "")}</span>
    ${opts.end ? cd(opts.end) : ""}
    ${info.pct != null ? `<span class="meter"><i style="width:${info.pct.toFixed(1)}%"></i></span>` : ""}
  </button>`;
}
function evMilestones(e, info){
  const steps = (e.interimSteps || []).filter(x => x && x.goal != null).sort((a, b) => a.goal - b.goal);
  const final = (e.rewards || []).find(r => rewardParts(r).length);
  if (!steps.length && !final) return "";
  const thumbs = r => rewardParts(r).filter(p => p.name).slice(0, 3).map(p => itemImg(p.name, "") || '<span class="ph"></span>').join("");
  const row = (goal, r, isFinal) => `<div class="ms${info.max && info.cur >= goal ? " got" : ""}${isFinal ? " final" : ""}">
      <span class="goal">${goal != null ? esc(goal) : "★"}</span><span class="thumbs">${thumbs(r)}</span>
      <span class="main"><span class="t">${esc(rewardText(r) || "Reward")}</span>${isFinal ? '<span class="s" style="color:var(--ac)">Final reward</span>' : ""}</span></div>`;
  return `<section class="card frame"><div class="sec-h"><h2>Rewards</h2><span class="meta">${info.max ? "by score" : ""}</span></div>
    ${steps.map(x => row(x.goal, x.reward, false)).join("")}${final ? row(info.max || null, final, true) : ""}</section>`;
}
function evDetail(e, info, now, off){
  const end = ts(e.expiry), start = ts(e.activation);
  const steps = (e.interimSteps || []).filter(x => x && x.goal != null);
  const prog = info.pct != null ? `<div class="ev-prog">
      <div class="sec-h"><h2>Progress</h2><span class="meta mono">${info.max ? `${info.cur.toLocaleString()} / ${info.max.toLocaleString()}` : info.pct.toFixed(0) + "%"}</span></div>
      <div class="track"><i style="width:${info.pct.toFixed(1)}%"></i>${info.max ? steps.map(x => `<b class="${info.cur >= x.goal ? "hit" : ""}" style="left:${clampN(x.goal / info.max * 100)}%"></b>`).join("") : ""}</div>
      <p class="fine">${e.isCommunity ? "Shared progress across all players." : "Event progress from the game's public data. It may not match your own runs."}</p></div>` : "";
  const drops = (e.regionDrops || []).filter(Boolean);
  const jobs = (e.jobs || []).filter(j => j && j.type);
  return `<button class="back" data-act="ev-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"/></svg>Events</button>
    <div class="ev-hero"><canvas id="ev-hero" aria-hidden="true"></canvas>
      <div class="cap"><span class="nm">${esc(info.name)}</span><span class="wh">${esc(off ? info.th.where : (e.node || info.th.where || ""))}</span></div></div>
    <section class="card frame" style="--ac:${info.th.colors[2]}">
      <p class="tagline" style="color:var(--text)">${esc(info.blurb || "")}</p>
      ${off ? `<p class="fine">Not running right now. When it comes back, it appears at the top of Events with its live progress and rewards.</p>`
        : `<div class="summary"><div><span class="lbl">Ends in</span><b>${cd(end)}</b><span class="when" style="font-size:.74rem;color:var(--muted)">${esc(when(end))}</span></div>
           ${Number.isFinite(start) ? `<div><span class="lbl">Started</span><b style="font-size:1rem">${esc(new Date(start).toLocaleDateString(undefined, { month:"short", day:"numeric" }))}</b></div>` : ""}
           ${e.faction ? `<div><span class="lbl">Enemy</span><b style="font-size:1rem;display:flex;align-items:center;gap:.3rem">${factionImg(e.faction)}${esc(e.faction)}</b></div>` : ""}</div>${prog}`}
    </section>
    ${off ? "" : `<div style="--ac:${info.th.colors[2]}">${evMilestones(e, info)}</div>`}
    ${drops.length && !off ? `<section class="card frame"><div class="sec-h"><h2>Pick up in missions</h2></div><div class="recents">${drops.map(x => `<span class="chip static">${esc(unresolved(x) ? info.name + " pickup" : x.replace(/ Event Pickup$/, " pickup"))}</span>`).join("")}</div></section>` : ""}
    ${jobs.length && !off ? `<section class="card frame"><div class="sec-h"><h2>Event bounties</h2></div><ul class="rows">${jobs.map(j => `<li class="row row-2"><span class="idx"><span>◆</span></span>
      <span class="main"><span class="t">${esc(j.type)}</span><span class="s">${esc((j.enemyLevels || []).length ? "Level " + j.enemyLevels.join("–") : "")}${(j.standingStages || []).length ? " · " + j.standingStages.reduce((a, b) => a + b, 0).toLocaleString() + " standing" : ""}</span>
      <span class="s wrap" style="color:var(--gold)">${esc((j.rewardPool || []).slice(0, 6).join(", "))}</span></span></li>`).join("")}</ul></section>` : ""}`;
}
function eventsView(d, now){
  needItems();
  const live = (d.events || []).filter(e => ts(e.expiry) > now);
  if (EV.open) {
    let e = null, off = false;
    if (EV.open.startsWith("lib:")) { e = { tag:EV.open.slice(4) }; off = true; }
    else e = live.find(x => (x.id || x.tag) === EV.open);
    if (e) {
      const info = off ? (() => { const key = EV.open.slice(4), th = FX ? FX.THEMES[key] : null; return { key, th, name:th ? th.name : "Event", blurb:th ? th.blurb : "", pct:null, max:0, cur:0 }; })() : evInfo(e);
      return `<div class="view">${evDetail(e, info, now, off)}</div>`;
    }
    EV.open = null;
  }
  // Only running events are listed. Themes for recurring events stay built in and are matched when those events return.
  const liveCards = live.map(e => evCard(e.id || e.tag, evInfo(e), { where:e.node || evInfo(e).th.where, end:ts(e.expiry) })).join("");

function tick(){
  if (document.visibilityState !== "visible") return;
  const now = Date.now();
  let rerender = false;
  document.querySelectorAll("[data-end]").forEach(el => {
    const end = +el.dataset.end;
    if (end <= now) rerender = true;
    el.textContent = dur(end - now);
  });
  document.querySelectorAll("[data-cycle-end]").forEach(el => { if (+el.dataset.cycleEnd <= now) rerender = true; });
  document.querySelectorAll("[data-start]").forEach(el => {
    const a = +el.dataset.start, b = +el.dataset.stop;
    el.style.width = Math.min(100, Math.max(0, (now - a) / (b - a) * 100)).toFixed(1) + "%";
  });
  if (rerender) render(); else paintStatus();
}

function paintSky(){
  const c = $("#sky"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  g.fillStyle = "#03050a"; g.fillRect(0, 0, w, h);
  const neb = (x, y, r, col) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(3,5,10,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); };
  neb(w * .85, h * .1, Math.max(w, h) * .55, "rgba(40,90,140,.22)");
  neb(w * .15, h * .95, Math.max(w, h) * .5, "rgba(120,70,30,.14)");
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = Math.round(w * h / 2600);
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h, r = rnd() < .92 ? .5 + rnd() * .5 : 1 + rnd() * .7;
    g.globalAlpha = .25 + rnd() * .6; g.fillStyle = rnd() < .15 ? "#ffe2a8" : "#cfe6ff";
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
}

const STAGGER = ".cycle,.reset,.fis,.card,.inv,.nw-row,.wk-row,.hit,.drop-group,.order,.ev-card";
function animateIn(root, dir, axis){
  if (REDUCED.matches || !root || !root.animate) return;
  const d = (dir || 1) * 22;
  const from = axis === "x" ? `translateX(${d}px)` : `translateY(${d}px)`;
  const view = root.querySelector(".view") || root;
  view.animate([{ opacity:0, transform:from }, { opacity:1, transform:"none" }], { duration:280, easing:"cubic-bezier(.2,.75,.25,1)" });
  const bar = root.querySelector(":scope > .toolbar");
  if (bar) bar.animate([{ opacity:0 }, { opacity:1 }], { duration:200, easing:"ease-out" });
  [...view.querySelectorAll(STAGGER)].slice(0, 12).forEach((el, i) =>
    el.animate([{ opacity:0, transform:"translateY(10px) scale(.985)" }, { opacity:1, transform:"none" }],
      { duration:300, delay:60 + i * 32, easing:"cubic-bezier(.2,.75,.25,1)", fill:"backwards" }));

    if (!list.length) throw new Error("empty list");

    store.set("orbiter.wfm.items", { t:Date.now(), list });
  }).catch(() => { SR.itemsState = had ? "ready" : "error"; })
    .finally(() => { if (prefs.tab === "search" && !SR.detail) paintSearch(); });
}

/* One searchable list: every tradable item from warframe.market plus every other item in the game data. */
function searchPool(){
  const key = (SR.items ? SR.items.length : 0) + ":" + (ITEM_LIST ? ITEM_LIST.length : 0);
  if (SR.pool && SR.poolKey === key) return SR.pool;
  const pool = [], seen = new Map();
  const info = {};
  if (ITEM_LIST) for (const e of ITEM_LIST) info[e[0].toLowerCase()] = e;
  for (const it of SR.items || []) {
    const n = it[1].toLowerCase();
    const e = info[n] || info[n.replace(/\s+(set|blueprint)$/, "")];
    const h = { name:it[1], slug:it[0], thumb:it[2], tradable:true, cat:e ? ITEM_CATS[e[2]] : /\sset$/.test(n) ? "Set" : "", loc:e && e[3] || "", n };
    seen.set(n, h); pool.push(h);
  }
  for (const e of ITEM_LIST || []) {
    const n = e[0].toLowerCase();
    if (seen.has(n)) continue;
    const h = { name:e[0], file:e[1], tradable:false, cat:ITEM_CATS[e[2]] || "", loc:e[3] || "", n };
    seen.set(n, h); pool.push(h);
  }
  SR.pool = pool; SR.poolKey = key; SR.byName = seen;
  return pool;
}
function matchItems(q){
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const out = [];
  for (const h of searchPool()) {
    const n = h.n;
    if (!words.every(w => n.includes(w))) continue;
    const rank = n.startsWith(words[0]) ? 0 : n.split(/[\s'-]+/).some(t => t.startsWith(words[0])) ? 1 : 2;
    out.push([rank, h.cat === "Cosmetic" || h.cat === "Glyph" || h.cat === "Sigil" ? 1 : 0, n.length, h]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return out.slice(0, 40).map(x => x[3]);
}
const hitArt = (h, cls) => h.file ? img(h.file, cls, h.name) : artFor(h.name, h.thumb, cls);
function findHit(name){ searchPool(); return (SR.byName && SR.byName.get(String(name).toLowerCase())) || null; }
function artFor(name, thumb, cls){
  const f = itemFile(name) || itemFile(String(name).replace(/\s+set$/i, ""));
  if (f) return img(f, cls, name);
  if (thumb) return `<img class="${cls}" src="${WFM_ASSETS}${esc(thumb)}" alt="${esc(name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
  return `<span class="${cls} ph" aria-hidden="true"></span>`;
}
const fmtChance = c => (c < 1 ? c.toFixed(2) : c < 10 ? c.toFixed(1).replace(/\.0$/, "") : String(Math.round(c))) + "%";
const rarClass = r => "rar-" + String(r || "common").toLowerCase().replace(/[^a-z]/g, "");

function groupDrops(arr, query){
  const q = query.toLowerCase().trim();
  const relicBase = /\s+relic$/i.test(query) ? q.replace(/\s+relic$/, "") : null;
  const relicRe = /^(.*?) Relic(?: \((Intact|Exceptional|Flawless|Radiant)\))?$/i;
  const groups = new Map(), contents = new Map();
  for (const e of Array.isArray(arr) ? arr : []) {
    const item = String(e.item || ""), place = String(e.place || ""), chance = Number(e.chance) || 0;
    const m = relicRe.exec(place);
    if (relicBase && m && m[1].toLowerCase() === relicBase) {
      const c = contents.get(item) || { item, rarity:e.rarity, ref:{} };
      c.ref[(m[2] || "Intact").toLowerCase()] = chance; contents.set(item, c);
      continue;
    }
    if (!item.toLowerCase().includes(q)) continue;
    const g = groups.get(item) || new Map();
    if (m) {
      const key = m[1] + " Relic";
      const r = g.get(key) || { place:key, relic:m[1], ref:{}, rarity:e.rarity, chance:0 };
      r.ref[(m[2] || "Intact").toLowerCase()] = chance; r.chance = Math.max(r.chance, chance); g.set(key, r);
    } else {
      const prev = g.get(place);
      if (!prev || prev.chance < chance) g.set(place, { place, rarity:e.rarity, chance });
    }
    groups.set(item, g);
  }
  const list = [...groups.entries()].map(([item, g]) => ({ item, rows:[...g.values()].sort((a, b) => b.chance - a.chance) }))
    .sort((a, b) => (b.item.toLowerCase() === q) - (a.item.toLowerCase() === q) || a.item.localeCompare(b.item));
  return { groups:list.slice(0, 12), extra:Math.max(0, list.length - 12),
    contents:[...contents.values()].sort((a, b) => (b.ref.intact || 0) - (a.ref.intact || 0)) };
}

function orderRows(list, kind, itemName){

function whisperFor(kind, i){

            <span class="main"><span class="t">${esc(r.place)}</span><span class="s ${rarClass(r.rarity)}">${esc(r.rarity || "")}${r.ref.radiant != null ? ` · Radiant ${fmtChance(r.ref.radiant)}` : ""}</span></span>
            <span class="chance">${fmtChance(r.ref.intact != null ? r.ref.intact : r.chance)}<small>${r.ref.intact != null ? "Intact" : ""}</small></span></li>`;

    <div class="detail-head">${d.file ? img(d.file, "hero", d.name) : artFor(d.name, d.thumb, "hero")}<div><div class="big">${esc(d.name)}</div>

      d.loc.split(/,\s*(?:and\s+)?|\s+and\s+/).map(s => s.trim()).filter(Boolean).map(p => {

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;opacity:0;top:0;left:0"; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}
function searchClick(b){
  if (b.id === "q-clear") { $("#q").value = ""; SR.q = ""; SR.detail = null; paintSearch(); $("#q").focus(); return true; }
  if (b.dataset.open != null) { const h = SR.hits[+b.dataset.open]; if (h) openHit(h); return true; }
  if (b.dataset.drops) { openDetail(SR.q.trim(), "", ""); return true; }
  if (b.dataset.act === "recent-clear") { SR.recent = []; store.set("orbiter.recent", SR.recent); paintSearch(); toast("Search history cleared"); return true; }
  if (b.dataset.recent != null) { const r = SR.recent[+b.dataset.recent]; if (r) openDetail(r[0], r[1], r[2]); return true; }
  if (b.dataset.act === "back") { closeDetail(); return true; }
  if (b.dataset.act === "detail-retry" && SR.detail) { const d = SR.detail; openDetail(d.name, d.slug, d.thumb); return true; }
  if (b.dataset.act === "market-retry") { SR.itemsState = "idle"; store.set("orbiter.wfm.items", null); loadMarketItems(); paintSearch(); return true; }
  if (b.dataset.more != null && SR.detail) { SR.detail.open[+b.dataset.more] = true; paintSearch(); return true; }
  if (b.dataset.whisper) {
    const [kind, i] = b.dataset.whisper.split(":");
    const text = whisperFor(kind, +i);
    if (text) copyText(text).then(ok => toast(ok ? "Whisper copied" : "Couldn't copy. Long-press to select instead."));
    return true;
  }
  return false;
}

/* ================= updates (Android app only) ================= */
const BRIDGE = IN_APP && window.OrbiterApp ? window.OrbiterApp : null;
const UPD = { state:"idle", current:0, latest:0, url:"", pct:0, msg:"" };
try { if (BRIDGE) UPD.current = +BRIDGE.versionCode() || 0; } catch (e) {}
window.__orbiterUpdate = r => {
  Object.assign(UPD, r || {});
  if (UPD.state === "available") $("#set-btn").classList.add("has-update");
  if (UPD.state === "latest" || UPD.state === "installing") $("#set-btn").classList.remove("has-update");
  if (UPD.auto && UPD.state === "available") toast(`Build ${UPD.latest} is available. Open Settings to update.`);
  UPD.auto = false;
  if (!$("#sheet").hidden) openSettings();
};
function checkUpdates(auto){
  if (!BRIDGE || UPD.state === "checking" || UPD.state === "downloading") return;
  Object.assign(UPD, { state:"checking", auto:!!auto });
  store.set("orbiter.updCheck", Date.now());
  try { BRIDGE.checkForUpdate(); } catch (e) { UPD.state = "error"; UPD.msg = "The updater isn't available in this build."; }
  if (!$("#sheet").hidden) openSettings();
}
function installUpdate(){
  if (!BRIDGE || !UPD.url) return;
  Object.assign(UPD, { state:"downloading", pct:0 });
  try { BRIDGE.installUpdate(UPD.url); } catch (e) { UPD.state = "error"; UPD.msg = "Couldn't start the download."; }
  if (!$("#sheet").hidden) openSettings();
}
function updateSection(){
  if (!BRIDGE) return IN_APP ? `<p class="fine">This build can't update itself. Install the latest APK from the GitHub Releases page once; later builds can update from here.</p>`
    : `<p class="fine">The web version always loads the newest files, so there's nothing to update.</p>`;
  const cur = UPD.current ? `You have build ${UPD.current}.` : "";
  let body = "";
  switch (UPD.state) {
    case "checking": body = `<p class="fine">Checking GitHub for a newer build…</p>`; break;
    case "latest": body = `<p class="fine">${cur} That's the newest build.</p><button class="btn" data-act="upd-check">Check again</button>`; break;
    case "available": body = `<p class="fine">${cur} Build ${UPD.latest} is ready.</p><button class="btn solid" data-act="upd-install">Download and install build ${UPD.latest}</button>`; break;
    case "downloading": body = `<p class="fine">Downloading build ${UPD.latest}… ${UPD.pct ? UPD.pct + "%" : ""}</p><div class="stock"><i style="width:${UPD.pct || 2}%"></i></div>`; break;
    case "permission": body = `<p class="fine">Android needs permission for Orbiter Panel to install updates. Turn on <b>Allow from this source</b> in the screen that opened, come back, then tap Install again.</p><button class="btn solid" data-act="upd-install">Install build ${UPD.latest}</button>`; break;
    case "installing": body = `<p class="fine">Android's installer is open. Tap <b>Update</b> there; your settings are kept.</p>`; break;
    case "error": body = `<p class="fine">${esc(UPD.msg || "Couldn't check for updates.")}</p><button class="btn" data-act="upd-check">Try again</button>`; break;
    default: body = `<p class="fine">${cur} Updates come from the GitHub Releases page.</p><button class="btn" data-act="upd-check">Check for updates</button>`;
  }
  return body;
}

    <p class="fine">World data from the community-run warframestat.us API, refreshed every 2 minutes. If it's down, the app reads Digital Extremes' official feed directly${S.source === "de" ? " (doing that right now)" : ""}. Game images are Digital Extremes' art, shown under the Warframe Content Policy. Not affiliated with Digital Extremes.</p>
    <button class="btn" data-act="close">Done</button>
  </div>`;
  sh.hidden = false;
  if (keepFocus) sh.querySelector("[data-act=close]").focus();
}
function closeSettings(){ $("#sheet").hidden = true; $("#set-btn").focus(); }

/* ================= events ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) { if (e.target.id === "sheet") closeSettings(); return; }
  if (b.dataset.tab) { switchTab(b.dataset.tab); return; }
  if (prefs.tab === "search" && b.closest("#spane") && searchClick(b)) return;
  if (b.id === "status" || b.dataset.act === "refresh") { load(); return; }
  if (b.id === "set-btn") { openSettings(); return; }
  if (b.id === "install-btn" || b.dataset.act === "install") { promptInstall(); return; }
  if (b.id === "fs-btn") {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen().catch(() => {});
    else d.documentElement.requestFullscreen({ navigationUI:"hide" }).catch(() => {});
    return;
  }
  if (b.dataset.act === "close") { closeSettings(); return; }
  if (b.dataset.act === "upd-check") { checkUpdates(false); return; }
  if (b.dataset.act === "upd-install") { installUpdate(); return; }
  if (b.dataset.scale) { prefs.scale = b.dataset.scale; savePrefs(); applyScale(); openSettings(); placeMark(false); return; }
  if (b.dataset.plat) {
    if (prefs.platform !== b.dataset.plat) {
      prefs.platform = b.dataset.plat; savePrefs();
      const c = store.get("orbiter.cache." + prefs.platform, null);
      S.data = c && c.data || null; S.fetchedAt = c && c.t || 0;
      load();
    }
    openSettings(); return;
  }
  if (b.dataset.clock) { prefs.clock = b.dataset.clock; savePrefs(); openSettings(); render(); return; }
  if (b.dataset.fmode) { prefs.fisMode = b.dataset.fmode; prefs.fisTiers = []; savePrefs(); render(); return; }
  if (b.dataset.ftier) {
    const t = b.dataset.ftier, s = new Set(prefs.fisTiers);
    s.has(t) ? s.delete(t) : s.add(t); prefs.fisTiers = [...s]; savePrefs(); render(); return;
  }
  if ("ffast" in b.dataset) { prefs.fisFast = !prefs.fisFast; savePrefs(); render(); return; }
  if (b.dataset.ev) { EV.open = b.dataset.ev; EV.playing = null; $("#pane").scrollTop = 0; render(); animateIn($("#pane"), 1, "x"); return; }
  if (b.dataset.act === "ev-back") { EV.open = null; render(); animateIn($("#pane"), -1, "x"); return; }
  if (b.dataset.wauto) { const el = $("#nightwave"); if (el) el.scrollIntoView({ behavior:REDUCED.matches ? "auto" : "smooth", block:"start" }); return; }
  if (b.dataset.wk) { wkTap(b.dataset.wk); return; }
  if (b.dataset.wexp) { WK.open[b.dataset.wexp] = !WK.open[b.dataset.wexp]; render(); return; }
  if (b.dataset.whide) { const id = b.dataset.whide; if (wkHidden[id]) delete wkHidden[id]; else wkHidden[id] = 1; store.set("orbiter.weeklyHidden", wkHidden); render(); return; }
  if (b.dataset.act === "wk-edit") { WK.edit = !WK.edit; render(); return; }
  if (b.dataset.nw) {
    const id = b.dataset.nw;
    if (nwDone[id]) delete nwDone[id]; else nwDone[id] = Date.now();
    const live = new Set(((S.data && S.data.nightwave && S.data.nightwave.activeChallenges) || []).map(c => c.id));
    Object.keys(nwDone).forEach(k => { if (!live.has(k)) delete nwDone[k]; });
    store.set("orbiter.nwDone", nwDone); render(); return;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSettings(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - S.fetchedAt > MIN) load();
});
window.addEventListener("online", () => load());
let skyT = 0; window.addEventListener("resize", () => { clearTimeout(skyT); skyT = setTimeout(() => { paintSky(); placeMark(false); }, 150); });

/* ================= boot ================= */
if (document.fullscreenEnabled && !isInstalled()) $("#fs-btn").hidden = false;
if (prefs.tab === "nightwave") prefs.tab = "weekly";
// A home screen widget can ask for a tab, at launch or while the app is open.
try { const t = BRIDGE && BRIDGE.startTab && BRIDGE.startTab(); if (t && TABS.some(x => x[0] === t)) prefs.tab = t; } catch (e) {}
window.__orbiterOpenTab = id => { if (!TABS.some(x => x[0] === id)) return; if (!$("#sheet").hidden) closeSettings(); switchTab(id); };
if (!TABS.some(t => t[0] === prefs.tab)) prefs.tab = "world";
paintSky();
paintTabs();
placeMark(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeMark(false));
showPanes();
if (prefs.tab === "search") openSearch();
render();
pushWidgetSnapshot(); // widgets get the cached data straight away, before the first refresh
animateIn(prefs.tab === "search" ? $("#spane") : $("#pane"), 1);
// quietly look for a newer APK at most twice a day
if (BRIDGE && Date.now() - (store.get("orbiter.updCheck", 0) || 0) > 12 * HOUR) setTimeout(() => checkUpdates(true), 4000);
load();
setInterval(tick, 1000);
if (!IN_APP && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
