name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk OrbiterPanel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbiterPanel-apk
          path: OrbiterPanel.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbiter Panel build ${{ github.run_number }}
          body: |
            Download **OrbiterPanel.apk** below and open it on your Android device to install, or use Settings → Check for updates inside the app.

            Unofficial fan project built with AI assistance. Not affiliated with Digital Extremes. See the README for disclaimers.
          files: OrbiterPanel.apk
          make_latest: true
